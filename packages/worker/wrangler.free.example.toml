# Free-first Cloudflare resource template for AI-Answer-Agent.
# Replace only the REPLACE_* values after provisioning resources.
# Do not commit secrets.

name = "devops-ai-agent"
main = "src/entrypoint.js"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

[observability]
enabled = true

[ai]
binding = "AI"

[[kv_namespaces]]
binding = "API_KEYS"
id = "REPLACE_WITH_EXISTING_API_KEYS_NAMESPACE_ID"

[[kv_namespaces]]
binding = "AI_CACHE"
id = "REPLACE_WITH_AI_CACHE_NAMESPACE_ID"

[[d1_databases]]
binding = "INTERVIEW_DB"
database_name = "ai-answer-agent"
database_id = "REPLACE_WITH_D1_DATABASE_ID"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "AI_ASSETS"
bucket_name = "ai-answer-agent-assets"

# Enable after provisioning the Durable Object migration.
[[durable_objects.bindings]]
name = "INTERVIEW_SESSIONS"
class_name = "InterviewSession"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["InterviewSession"]

[[queues.producers]]
binding = "INTERVIEW_QUEUE"
queue = "ai-answer-agent-interview"

[[workflows]]
name = "interview-analysis"
binding = "INTERVIEW_WORKFLOW"
class_name = "InterviewAnalysisWorkflow"

# Optional external model fallback. Use secrets, not vars:
#   npx wrangler secret put GATEWAY_API_TOKEN
#   npx wrangler secret put GATEWAY_API_KEY
