name = "devops-ai-agent"
main = "src/entrypoint.js"
compatibility_date = "2026-09-27"
compatibility_flags = ["nodejs_compat"]

[observability]
enabled = true

[vars]
ENVIRONMENT = "production"

# Optional AI Gateway credentials must be stored as Wrangler secrets.
# npx wrangler secret put GATEWAY_API_TOKEN
# npx wrangler secret put GATEWAY_API_KEY

[[kv_namespaces]]
binding = "API_KEYS"
id = "c86c6823303947c49f35fa12cb52df8f"

[ai]
binding = "AI"

# -----------------------------------------------------------------------------
# FREE-FIRST CLOUDflare RESOURCES
# -----------------------------------------------------------------------------
# Existing account-specific IDs stay commented until provisioned in your
# Cloudflare account. Never invent IDs or commit secrets.

# Hot response/config cache
# [[kv_namespaces]]
# binding = "AI_CACHE"
# id = "YOUR_AI_CACHE_KV_ID"

# Persistent interview data
# [[d1_databases]]
# binding = "INTERVIEW_DB"
# database_name = "ai-answer-agent"
# database_id = "YOUR_D1_DATABASE_ID"
# migrations_dir = "migrations"

# Resume/JD/transcript/report objects
# [[r2_buckets]]
# binding = "AI_ASSETS"
# bucket_name = "ai-answer-agent-assets"

# Live interview state; SQLite-backed DO is supported on Workers Free.
# [[durable_objects.bindings]]
# name = "INTERVIEW_SESSIONS"
# class_name = "InterviewSession"
#
# [[migrations]]
# tag = "v1"
# new_sqlite_classes = ["InterviewSession"]

# Background interview work
# [[queues.producers]]
# binding = "INTERVIEW_QUEUE"
# queue = "ai-answer-agent-interview"

# Durable post-interview analysis
# [[workflows]]
# name = "interview-analysis"
# binding = "INTERVIEW_WORKFLOW"
# class_name = "InterviewAnalysisWorkflow"

# Semantic resume/JD/project retrieval.
# Vectorize currently has a Workers Free allocation; this index uses the
# 768-dimensional BGE base embedding model configured in src/interview/retrieval.js.
# Create it once with:
#   npx wrangler vectorize create ai-answer-agent-context --dimensions=768 --metric=cosine
# Then enable:
# [[vectorize]]
# binding = "VECTORIZE"
# index_name = "ai-answer-agent-context"
