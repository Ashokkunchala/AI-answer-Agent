name = "devops-ai-agent"
main = "src/entrypoint.js"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

[observability]
enabled = true

[vars]
ENVIRONMENT = "production"

# Optional AI Gateway premium fallback.
# Prefer secrets over plaintext values:
#   npx wrangler secret put GATEWAY_API_TOKEN
#   npx wrangler secret put GATEWAY_API_KEY

[[kv_namespaces]]
binding = "API_KEYS"
# Existing API_KEYS namespace.
id = "c86c6823303947c49f35fa12cb52df8f"

[ai]
binding = "AI"

# Existing voice endpoint is handled by the Worker WebSocket export.
# No separate websocket binding is required by the application.

